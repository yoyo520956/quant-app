name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: prepare assets
        run: |
          cd Resources
          for f in *.gz; do [ -e "$f" ] && rm -f "${f%.gz}" && gunzip -kf "$f" && rm -f "$f"; done
          ls -la "$PWD"
          ls -la
      - name: install xcodegen
        run: |
          brew install xcodegen
          xcodegen generate
      - name: build ipa
        run: |
          set -o pipefail
          xcodebuild -project QuantAdvisor.xcodeproj -scheme QuantAdvisor \
            -configuration Release -archivePath build/Quant.xcarchive \
            CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO archive > build.log 2>&1
          RC=$?
          if [ $RC -ne 0 ]; then
            echo "=== xcodebuild failed, tail ==="
            tail -80 build.log
            exit $RC
          fi
          grep -c "ARCHIVE SUCCEEDED" build.log || true
          mkdir -p build/Payload
          cp -R build/Quant.xcarchive/Products/Applications/QuantAdvisor.app build/Payload/
          cd build && zip -qry QuantAdvisor-unsigned.ipa Payload
          ls -la QuantAdvisor-unsigned.ipa
      - name: verify bundle
        run: |
          set -eo pipefail
          cd build/Payload/QuantAdvisor.app
          ls -la
          test -f index.html && echo "index.html OK"
          test -f model.json && echo "model.json OK"
          test -f hl_model.json && echo "hl_model.json OK"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" Info.plist
          strings QuantAdvisor 2>/dev/null | grep -a -m1 "qm://" && echo "scheme OK"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
      - uses: actions/upload-artifact@v4
        with:
          name: QuantAdvisor-unsigned
          path: build/QuantAdvisor-unsigned.ipa
